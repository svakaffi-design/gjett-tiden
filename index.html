<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tidsgjetteren</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Space Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    user-select: none;
    overflow: hidden;
    cursor: none;
  }

  #target {
    font-size: clamp(4rem, 15vw, 10rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    transition: opacity 0.3s;
  }

  #target span {
    font-family: 'Courier Prime', monospace;
    font-style: italic;
    font-size: 0.45em;
    font-weight: 400;
    letter-spacing: 0.1em;
    display: block;
    margin-top: 0.2em;
    opacity: 0.4;
  }

  #result {
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s;
    margin-top: 2.5rem;
  }

  #result.visible {
    opacity: 1;
  }

  #result-time {
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  #result-diff {
    font-family: 'Courier Prime', monospace;
    font-style: italic;
    font-size: clamp(0.8rem, 2vw, 1rem);
    opacity: 0.4;
    margin-top: 0.5em;
    letter-spacing: 0.05em;
  }

  #hint {
    position: absolute;
    bottom: 6vh;
    font-family: 'Courier Prime', monospace;
    font-style: italic;
    font-size: clamp(0.65rem, 1.5vw, 0.85rem);
    opacity: 0.2;
    letter-spacing: 0.15em;
    transition: opacity 0.4s;
  }

  #bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 1px;
    background: #fff;
    width: 0%;
    transition: width 0.05s linear;
    opacity: 0.15;
  }

  #state-dot {
    position: absolute;
    top: 6vh;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #state-dot.active {
    opacity: 1;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .flash {
    animation: flash 0.15s ease-out;
  }

  @keyframes flash {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="state-dot"></div>
<div id="target">
  <span id="label">hvor lang tid er...</span>
  <span id="target-num">—</span>
</div>
<div id="result">
  <div id="result-time">—</div>
  <div id="result-diff"></div>
</div>
<div id="hint">mellomrom for å starte</div>
<div id="bar"></div>

<script>
  const states = { IDLE: 'idle', COUNTING: 'counting', DONE: 'done' };
  let state = states.IDLE;
  let target = null;
  let startTime = null;
  let barInterval = null;

  const targetEl = document.getElementById('target-num');
  const resultEl = document.getElementById('result');
  const resultTimeEl = document.getElementById('result-time');
  const resultDiffEl = document.getElementById('result-diff');
  const hintEl = document.getElementById('hint');
  const barEl = document.getElementById('bar');
  const dotEl = document.getElementById('state-dot');

  function randomTarget() {
    return Math.floor(Math.random() * 20) + 1;
  }

  function formatTime(ms) {
    return (ms / 1000).toFixed(2) + 's';
  }

  function start() {
    target = randomTarget();
    targetEl.textContent = target + 's';
    state = states.COUNTING;
    startTime = Date.now();
    resultEl.classList.remove('visible');
    hintEl.textContent = 'mellomrom for å stoppe';
    dotEl.classList.add('active');
    barEl.style.width = '0%';

    barInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      const pct = Math.min((elapsed / target) * 100, 100);
      barEl.style.width = pct + '%';
    }, 50);
  }

  function stop() {
    const elapsed = Date.now() - startTime;
    clearInterval(barInterval);
    state = states.DONE;
    dotEl.classList.remove('active');

    const diff = elapsed / 1000 - target;
    const sign = diff >= 0 ? '+' : '';

    resultTimeEl.textContent = formatTime(elapsed);
    resultDiffEl.textContent = sign + diff.toFixed(2) + 's fra målet';
    resultEl.classList.add('visible');
    hintEl.textContent = 'mellomrom for ny runde';
    barEl.style.width = '100%';
    setTimeout(() => { barEl.style.width = '0%'; }, 1000);

    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 150);
  }

  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (state === states.IDLE || state === states.DONE) {
      start();
    } else if (state === states.COUNTING) {
      stop();
    }
  });

  // Touch support
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (state === states.IDLE || state === states.DONE) {
      start();
    } else if (state === states.COUNTING) {
      stop();
    }
  }, { passive: false });
</script>
</body>
</html>
